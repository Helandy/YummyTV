name: Deploy Pages

on:
    push:
        branches:
            - main
        paths:
            - site/**
            - .github/workflows/pages.yml
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v5

            -   name: Upload site
                uses: actions/upload-pages-artifact@v3
                with:
                    path: site

            -   name: Deploy
                id: deployment
                uses: actions/deploy-pages@v4
