#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M
#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#YummyTV id
yummytv.applicationId=su.afk.yummy.tv
# Version
# Стабильный релиз: versionName=1.21.1, тег на GitHub v1.21.1.
# Бета: 4-й сегмент — номер беты после стабильной 1.21.1: versionName=1.21.1.2-beta
# (именно "-beta", без цифры после), тег b1.21.1.2 и галка "Set as a pre-release" в релизе —
# её получат только включившие «Бета-версии». Следующая стабильная — 1.21.2.
# versionCode только растёт, иначе стабильная версия не встанет поверх беты.
# Подробно: docs/beta-updates.md
yummytv.versionName=1.24.1
yummytv.versionCode=122
#
# metrica: yummytv.appmetricaApiKey / yummytv.varioqubClientId — в local.properties
#
# AVD для ./gradlew generateBaselineProfiles / runProfileBenchmarks (телефон + Android TV).
# Свои имена — в ~/.gradle/gradle.properties или -Pyummytv.profile.avds=...
yummytv.profile.avds=37_Pixel_10_Pro_XL,14_Android_TV_1080p
