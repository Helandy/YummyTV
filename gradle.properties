# Version
# Стабильный релиз: versionName=1.21.1, тег на GitHub v1.21.1.
# Бета: 4-й сегмент — номер беты после стабильной 1.21.1: versionName=1.21.1.2-beta
# (именно "-beta", без цифры после), тег b1.21.1.2 и галка "Set as a pre-release" в релизе —
# её получат только включившие «Бета-версии». Следующая стабильная — 1.21.2.
# versionCode только растёт, иначе стабильная версия не встанет поверх беты.
# Подробно: docs/beta-updates.md
yummytv.versionName=1.23.3
yummytv.versionCode=119
