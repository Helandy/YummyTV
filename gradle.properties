#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M
#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#YummyTV id
yummytv.applicationId=su.afk.yummy.tv
# Version
# Стабильный релиз: versionName=1.21.1, тег на GitHub v1.21.1.
# Бета: 4-й сегмент — номер беты после стабильной 1.21.1: versionName=1.21.1.2-beta
# (именно "-beta", без цифры после), тег b1.21.1.2 и галка "Set as a pre-release" в релизе —
# её получат только включившие «Бета-версии». Следующая стабильная — 1.21.2.
# versionCode только растёт, иначе стабильная версия не встанет поверх беты.
# Подробно: docs/beta-updates.md
yummytv.versionName=1.29
yummytv.versionCode=160
#
# Внешние источники. false — отключить (по умолчанию всё включено).
# source.<имя> — один модуль
# (зависящие от него модули выключаются следом: availability, ashdi, fenix, moon).
# Мастер-выключатель: все модули source/* разом
yummytv.source.enabled=true
# 4K-серии (anime4k)
yummytv.source.anime4k=true
# Общая ручка наличия тайтлов на сервере YummyTV; нужна большинству источников ниже
yummytv.source.availability=true
# ailiberty.top (HLS)
yummytv.source.ailiberty=true
# online.anidub.com (HLS)
yummytv.source.anidub=true
# sameband.studio (дубляж)
yummytv.source.sameband=true
# studiomir.club (HLS)
yummytv.source.studiomir=true
# ashdi.vip (HLS-плеер)
yummytv.source.ashdi=true
# fenixplay.xyz (HLS-плеер)
yummytv.source.fenix=true
# moonanime.art (плеер Moon)
yummytv.source.moon=true
# animeon.club (отдаёт потоки Ashdi/Fenix/Moon)
yummytv.source.animeon=true
# animevost.org (прямой mp4)
yummytv.source.animevost=true
# Mikai (потоки Moon/Ashdi/Fenix)
yummytv.source.mikai=true
# anime1.best (Animebesst)
yummytv.source.animebesst=true
# dreamerscast.com (HLS)
yummytv.source.dreamerscast=true
# aniboom.one / animego.me (HLS)
yummytv.source.aniboom=true
# astar.bz (Anistar, HLS)
yummytv.source.anistar=true
# amd.online (Amedia)
yummytv.source.amedia=true
# AniLibria (cache.libria.fun, HLS)
yummytv.source.anilibria=true
#
# Внешние сервисы не-видео (мастер source.enabled их не трогает). false — отключить.
# Tenrai (api.tenrai.org): пометки филлер/рекап. Если выключен — пометки берутся с собственного API.
yummytv.external.tenrai=true
#
# metrica: yummytv.appmetricaApiKey / yummytv.varioqubClientId — в local.properties
#
# AVD для ./gradlew generateBaselineProfiles / runProfileBenchmarks (телефон + Android TV).
# Свои имена — в ~/.gradle/gradle.properties или -Pyummytv.profile.avds=...
yummytv.profile.avds=37_Pixel_10_Pro_XL,14_Android_TV_1080p
